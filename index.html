<!DOCTYPE html>
<!-- Trang HTML độc lập: gọi trực tiếp API work.ink từ trình duyệt -->
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Đảm bảo hiển thị đúng trên thiết bị di động -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work.ink Bypass</title>
    <style>
        /* Reset cơ bản */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Consolas, monospace;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .box {
            width: 100%;
            max-width: 520px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 24px;
        }
        h1 {
            font-size: 20px;
            color: #00ff88;
            text-align: center;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0d0d0d;
            border: 1px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #00ff88; }
        button {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #00cc6a; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #status {
            margin-top: 16px;
            font-size: 13px;
            min-height: 20px;
            word-break: break-all;
        }
        #status.ok { color: #00ff88; }
        #status.err { color: #ff4444; }
        #status.info { color: #ffcc00; }
        #result {
            margin-top: 10px;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 13px;
            word-break: break-all;
            display: none;
        }
        #result a { color: #00ff88; text-decoration: none; }
        #result a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box">
        <h1>WORK.INK BYPASS</h1>

        <!-- Ô nhập URL work.ink cần bypass -->
        <label for="urlInput">Nhập link work.ink</label>
        <input type="text" id="urlInput" placeholder="https://work.ink/xxxxx" autocomplete="off">

        <!-- Nút kích hoạt gọi API -->
        <button id="btnBypass" onclick="bypass()">BYPASS</button>

        <!-- Vùng hiển thị trạng thái xử lý -->
        <div id="status"></div>

        <!-- Vùng hiển thị link gốc sau khi resolve -->
        <div id="result"></div>
    </div>

    <script>
        // Khóa API work.ink được cung cấp
        const API_KEY = '335c2c33-4042-417f-a70f-95009e9ebee6';

        // Endpoint API work.ink dùng để resolve link rút gọn
        const API_ENDPOINT = 'https://work.ink/34jy/62df3ebc-8f02-4652-b04c-d918990b9124';

        // Tham chiếu DOM
        const urlInput = document.getElementById('urlInput');
        const btn      = document.getElementById('btnBypass');
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');

        // Hàm cập nhật trạng thái kèm lớp CSS tương ứng
        function setStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = type || '';
        }

        // Hàm chính: gửi yêu cầu bypass
        async function bypass() {
            const url = urlInput.value.trim();

            // Kiểm tra đầu vào rỗng
            if (!url) {
                setStatus('Lỗi: URL rỗng', 'err');
                return;
            }

            // Kiểm tra định dạng URL cơ bản
            if (!/^https?:\/\//i.test(url)) {
                setStatus('Lỗi: URL phải bắt đầu bằng http:// hoặc https://', 'err');
                return;
            }

            // Khóa nút và reset kết quả
            btn.disabled = true;
            resultEl.style.display = 'none';
            resultEl.innerHTML = '';
            setStatus('Đang gửi yêu cầu tới API...', 'info');

            try {
                // Gọi API work.ink với query string chứa url và api_key
                const endpoint = `${API_ENDPOINT}?url=${encodeURIComponent(url)}&api_key=${encodeURIComponent(API_KEY)}`;

                const response = await fetch(endpoint, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                // Đọc phản hồi dạng JSON, fallback text nếu không phải JSON
                let data;
                const text = await response.text();
                try { data = JSON.parse(text); } catch { data = { raw: text }; }

                // Xử lý mã lỗi HTTP
                if (!response.ok) {
                    setStatus(`Lỗi HTTP ${response.status}: ${data.error || data.message || 'Không xác định'}`, 'err');
                    return;
                }

                // Trích xuất link gốc từ nhiều khóa có thể có trong phản hồi
                const original =
                    data.original_url ||
                    data.url ||
                    data.destination ||
                    data.result ||
                    (data.data && (data.data.original_url || data.data.url));

                if (!original) {
                    setStatus('Lỗi: Phản hồi không chứa link gốc', 'err');
                    return;
                }

                // Hiển thị kết quả
                setStatus('Thành công', 'ok');
                resultEl.style.display = 'block';
                resultEl.innerHTML = `Link gốc: <a href="${original}" target="_blank" rel="noopener noreferrer">${original}</a>`;

            } catch (err) {
                // Bắt lỗi mạng hoặc CORS
                setStatus(`Lỗi kết nối: ${err.message}`, 'err');
            } finally {
                // Luôn mở khóa nút sau khi xử lý xong
                btn.disabled = false;
            }
        }

        // Cho phép nhấn Enter trong ô input để kích hoạt bypass
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') bypass();
        });
    </script>
</body>
</html>
